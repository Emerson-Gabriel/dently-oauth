<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Dently</title>
<style>
  :root { --fundo: #F6F9F8; --texto: #10231F; --comando: #0B6B60; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fundo);
         color: var(--texto); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 420px; padding: 24px; text-align: center; }
  a { color: var(--comando); font-weight: 600; }
</style>
<script>
  // Volta do Google Agenda para o Dently. O ModSecurity da hospedagem barra o parâmetro "scope"
  // (uma URL dentro da URL) que o Google acrescenta; esta página repassa só code e state (ou error)
  // para o callback do sistema e descarta o resto. Não guarda nada e não chama nenhum serviço.
  (function () {
    var destino = 'https://usedently.com.br/google/callback';
    var origem = new URLSearchParams(window.location.search);
    var repasse = new URLSearchParams();
    ['code', 'state', 'error'].forEach(function (chave) {
      if (origem.has(chave)) repasse.set(chave, origem.get(chave));
    });
    if (repasse.has('state') && (repasse.has('code') || repasse.has('error'))) {
      window.location.replace(destino + '?' + repasse.toString());
    }
  })();
</script>
</head>
<body>
<main>
  <p>Voltando para o Dently...</p>
  <p>Se nada acontecer, <a href="https://usedently.com.br/agenda">abra a Agenda</a> e clique em Conectar Google de novo.</p>
</main>
</body>
</html>
